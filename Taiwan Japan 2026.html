        function calculateAutomaticMinutes(coord1, coord2) {
            if (!coord1 || !coord2) return null;
            
            const R = 6371; 
            const dLat = (coord2[0] - coord1[0]) * Math.PI / 180;
            const dLon = (coord2[1] - coord1[1]) * Math.PI / 180;
            
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(coord1[0] * Math.PI / 180) * Math.cos(coord2[0] * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            const straightDistanceKm = R * c;
            
            let roadDrivingTimeMins = Math.round(straightDistanceKm * 1.65);
            if (roadDrivingTimeMins < 5) return 5; 
            return roadDrivingTimeMins;
        }

                const time = row.Time || "";
                const activity = row.Activity || row.Location || "";
                const note = row.Note || "";
                
                const currentKey = getStrictKey(row.Location, row.Activity, dateKey);
                const intel = strictIntelligenceCatalog[currentKey];

                let detailsHtml = "";
                
                if (isPureTransitLeg(activity)) {
                    detailsHtml = `
                        <div class="mt-2 pt-1 flex items-center gap-1.5 text-slate-400 text-[10px] font-bold tracking-tight">
                            <i class="fa-solid fa-van-shuttle animate-bounce text-orange-400"></i>
                            <span>Transit activity leg — hidden local recommendations layout.</span>
                        </div>
                    `;
                } else if (intel) {
                    detailsHtml = `
                        <div class="mt-2 pt-2 border-t border-orange-50 space-y-2 text-[11px]">
                            <div class="bg-amber-50/50 p-2.5 rounded-xl border border-amber-200/20 space-y-1">
                                <p class="font-black text-[10px] uppercase tracking-wider text-amber-700"><i class="fa-solid fa-star mr-1"></i> 🏆 Location Highlight Features:</p>
                                <ul class="list-none space-y-1 text-slate-700 font-bold pl-1">
                                    <li><i class="fa-solid fa-circle-check text-amber-500 text-[8px] mr-1"></i> ${intel.highlights[0] || "Attraction feature point"}</li>
                                    <li><i class="fa-solid fa-circle-check text-amber-500 text-[8px] mr-1"></i> ${intel.highlights[1] || "Scenic viewpoint option"}</li>
                                    <li><i class="fa-solid fa-circle-check text-amber-500 text-[8px] mr-1"></i> ${intel.highlights[2] || "Local exploratory tracking"}</li>
                                </ul>
                            </div>
                            <div class="bg-orange-50/30 p-2.5 rounded-xl border border-orange-100/20 space-y-1">
                                <p class="font-black text-[10px] uppercase tracking-wider text-orange-600"><i class="fa-solid fa-utensils mr-1"></i> Top 3 Local Dishes:</p>
                                <ul class="list-disc list-inside space-y-0.5 text-slate-600 font-bold">
                                    <li>${intel.food[0] || "Regional specialty"}</li>
                                    <li>${intel.food[1] || "Traditional comfort side"}</li>
                                    <li>${intel.food[2] || "Seasonal street snack"}</li>
                                </ul>
                            </div>
                            <div class="flex items-center gap-1.5 text-slate-400 font-medium pt-1 px-1 text-[10px]">
                                <i class="fa-regular fa-clock"></i> <span>Official Operating Hours: ${intel.hours}</span>
                            </div>
                        </div>
                    `;
                }

                let currentTransitHtml = "";
                if (nextRow) {
                    const nextKey = getStrictKey(nextRow.Location, nextRow.Activity, dateKey);
                    let driveTimeText = "";

                    if (currentKey === "naha airport" && nextKey === "taipei airport") {
                        driveTimeText = "Approx. 1 hour 35 mins International Flight (OKA ✈️ TPE)";
                        currentTransitHtml = `
                            <div class="my-2 ml-6 pl-4 border-l-2 border-dashed border-sky-400 flex items-center gap-2 text-sky-600 font-bold text-[10px]">
                                <i class="fa-solid fa-plane-departure animate-pulse text-sky-500"></i>
                                <span>${driveTimeText}</span>
                            </div>
                        `;
                    } else {
                        let p1 = locationCoordinates[currentKey];
                        let p2 = locationCoordinates[nextKey];
                        let autoCalculatedMinutes = calculateAutomaticMinutes(p1, p2);

                        if (autoCalculatedMinutes) {
                            if (autoCalculatedMinutes > 55) {
                                let hrs = Math.floor(autoCalculatedMinutes / 60);
                                let mins = autoCalculatedMinutes % 60;
                                driveTimeText = `${hrs} hour ${mins} mins automatic navigation tracking route`;
                            } else {
                                driveTimeText = `${autoCalculatedMinutes} mins automated driving leg time`;
                            }
                        } else {
                            driveTimeText = "15 - 35 mins estimated scenic island transit lane";
                        }

                        currentTransitHtml = `
                            <div class="my-2 ml-6 pl-4 border-l-2 border-dashed border-teal-300 flex items-center gap-2 text-teal-600 font-bold text-[10px]">
                                <i class="fa-solid fa-car-side animate-pulse text-teal-500"></i>
                                <span>Next Leg Transit: ${driveTimeText}</span>
                            </div>
                        `;
                    }
                }

                const block = document.createElement('div');
                block.className = "bg-white p-4 rounded-2xl border border-orange-100/50 shadow-sm space-y-3 relative";
                
                block.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-black text-orange-600 bg-orange-50 px-2.5 py-1 rounded-lg">${time}</span>
                        <span class="text-[9px] uppercase tracking-wider font-bold text-slate-400 bg-slate-100 px-2 py-0.5 rounded"><i class="fa-solid fa-map-marker-alt"></i> ${currentKey ? currentKey.toUpperCase() : "ADVENTURE STOP"}</span>
                    </div>
                    <h3 class="font-black text-slate-900 text-sm tracking-tight">${activity}</h3>
                    ${note ? `<p class="text-[11px] text-amber-950 bg-amber-100/60 px-2.5 py-2 rounded-xl font-medium"><strong>⚠️ Note:</strong> ${note}</p>` : ""}
                    ${detailsHtml}
                `;
                
                container.appendChild(block);
                if (currentTransitHtml !== "") {
                    const transitWrapper = document.createElement('div');
                    transitWrapper.innerHTML = currentTransitHtml;
                    container.appendChild(transitWrapper);
                }

                let mappingKey = currentKey;
                if (locationCoordinates[mappingKey]) {
                    const marker = L.marker(locationCoordinates[mappingKey]).addTo(map).bindPopup(`<b>${activity}</b>`);
                    activeMarkers.push(marker);
                }
            }

            setTimeout(() => {
                map.invalidateSize();
                if (activeMarkers.length > 0) {
                    var group = new L.featureGroup(activeMarkers);
                    map.fitBounds(group.getBounds().pad(0.2));
                }
            }, 200);
        }
    </script>
</body>
</html>
