<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Trip: Okinawa & Taipei</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-12">

    <header class="bg-gradient-to-r from-teal-600 to-cyan-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i class="fa-solid fa-compass text-2xl text-amber-300"></i>
                <h1 class="font-bold text-lg tracking-wide">Family Tour 2026</h1>
            </div>
            <div class="bg-teal-800/50 px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-sm">
                <span id="current-date-badge">May 27</span>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 mt-4 space-y-6">

        <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-slate-700 text-sm tracking-wide uppercase flex items-center gap-2">
                    <i class="fa-solid fa-cloud-sun text-teal-600"></i> Live Location Weather
                </h2>
                <span class="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full" id="weather-update-time">Live</span>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div class="bg-gradient-to-br from-sky-50 to-blue-50 p-3 rounded-xl border border-sky-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase">Okinawa</p>
                        <p class="text-2xl font-black text-slate-800 mt-1" id="oki-temp">27°C</p>
                        <p class="text-xs text-slate-600 font-medium" id="oki-cond">Partly Cloudy</p>
                    </div>
                    <i class="fa-solid fa-cloud-sun text-3xl text-amber-400"></i>
                </div>
                <div class="bg-gradient-to-br from-emerald-50 to-teal-50 p-3 rounded-xl border border-emerald-100 flex items-center justify-between">
                    <div>
                        <p class="text-xs font-bold text-slate-500 uppercase">Taipei</p>
                        <p class="text-2xl font-black text-slate-800 mt-1" id="tpe-temp">25°C</p>
                        <p class="text-xs text-slate-600 font-medium" id="tpe-cond">Passing Shower</p>
                    </div>
                    <i class="fa-solid fa-cloud-showers-heavy text-3xl text-sky-400"></i>
                </div>
            </div>
        </section>

        <section class="overflow-x-auto no-scrollbar py-1">
            <div class="flex space-x-2" id="day-tabs">
                </div>
        </section>

        <section class="space-y-4" id="itinerary-timeline">
            </section>
        
    </main>

    <script>
        // Consolidated structured data parsed from your trip blueprints
        const tripData = {
            "May 27": {
                title: "Day 1: Arrival Day",
                events: [
                    { time: "20:50", activity: "Arrive Naha Airport", location: "Naha Airport", note: "Immigration & Customs. Look out for the chartered transport van driver directly outside arrivals.", food: "Convenience store quick grabs, A&W Burger (Airport Branch - if still open)." },
                    { time: "22:30", activity: "Hotel Check-in & Rest", location: "Hotel Chatan by Sunrest Resort", note: "Late snack or night stroll near American Village if energy permits.", food: "Late night Izakayas or Lawson/FamilyMart nearby." }
                ]
            },
            "May 28": {
                title: "Day 2: Mid-North Scenery & Shopping",
                events: [
                    { time: "09:30", activity: "Car Pickup & Breakfast", location: "Bee Rent Chatan", note: "Formal car rental pickup. Ensure all group credentials are ready.", food: "Local bakery or café options inside American Village." },
                    { time: "11:00", activity: "Okinawa Churaumi Aquarium 🐋", location: "Motobu Peninsula", note: "Fully indoor main exhibition area—ideal climate management for seniors. Don't skip the giant Kuroshio Sea tank.", shows: "Dolphin Show (Okichan Theater) runs at 11:30 & 13:00. Plan your internal path accordingly!", food: "Inocean Cafe (next to the main tank), Ocean Blue Restaurant." },
                    { time: "13:30", activity: "Kouri Island & Sea Bridge 🌉", location: "Kouri Island", note: "Scenic coastal crossing. Enjoy the vibrant turquoise blue seascape safely from the vehicle or brief photo stops.", food: "Kouri Shrimp Truck (Famous garlic shrimp), local sea salt ice cream." },
                    { time: "15:30", activity: "Cape Manzamo", location: "Onna Village", note: "Flat paved walking trail to see the signature elephant rock structure. Take advantage of the new AC-equipped rest facility.", food: "Local purple sweet potato tarts, brown sugar bubble milk tea at the visitor center." },
                    { time: "17:00", activity: "AEON Mall Okinawa Rycom 🛍️", location: "Kitanakagusuku", note: "Massive retail footprint. Pro-Tip: Grab an integrated shopping seat cart for seniors immediately inside the main entrance to minimize standing strain.", food: "Comprehensive Food Court: Local Okinawa Soba, Gyoza, and diverse global selections." },
                    { time: "20:00", activity: "Return to Base", location: "Hotel Chatan by Sunrest Resort", note: "Short, low-stress drive back to the accommodation quarters.", food: "Comforting Hot Pot or local Izakaya dinners adjacent to Chatan." }
                ]
            },
            "May 29": {
                title: "Day 3: Southern Culture & Historic Alleys",
                events: [
                    { time: "09:30", activity: "Check Out & Depart South", location: "Chatan to Naha Route", note: "Smooth transition packing baggage into the vehicle trunks.", food: "Quick on-the-go Japanese rice balls (Onigiri) or standard local cafe stops." },
                    { time: "10:30", activity: "Naminoue Shrine ⛩️", location: "Naha Cliffside", note: "Beautiful iconic coastal cliff views. Dedicated vehicle parking area is situated extremely close to the shrine main grounds to eliminate steep uphill walking.", food: "Traditional mochi treats and chilled local teas near the shrine plaza." },
                    { time: "11:30", activity: "Makishi Public Market 🍱", location: "Naha Central (Kokusai)", note: "Traditional indoor multi-level marketplace setup. Vibrant local culinary scene showcasing fresh, custom-cooked seafood plates.", food: "Okinawa Kitchen (highly rated local delicacies), customizable fresh sashimi stalls on the ground floor." },
                    { time: "13:30", activity: "Kokusai Street Exploration", location: "Naha Downtown", note: "Stick primarily to the flat central thoroughfare. Take frequent air-conditioned cafe breaks to maximize physical comfort.", food: "Blue Seal Ice Cream shops, local Okinawa brown sugar treats, iced matchas." },
                    { time: "15:30", activity: "Tsuboya Pottery Street", location: "Naha Historical Quarter", note: "Uniquely peaceful stone-paved old street. Exceptional showcase of artisanal Okinawan ceramic crafts. Low walking pace.", food: "Quaint traditional hidden tearooms offering iced Okinawan jasmine tea (Sanpin-cha)." },
                    { time: "18:00", activity: "Refuel & Return Car", location: "Bee Rent Chatan Terminal", note: "Ensure fuel tanks are topped up fully prior to drop-off window limit.", food: "Farewell Okinawa Dinner feast inside the American Village coastal hub." }
                ]
            },
            "May 30": {
                title: "Day 4: Transit to Taipei + Yilan Tour",
                events: [
                    { time: "05:30", activity: "Early Airport Transfer", location: "Hotel Chatan ➔ Naha Airport", note: "Early check-out procedures. Keep passports easily accessible.", food: "Naha Airport breakfast lounges, standard local terminal bakeries." },
                    { time: "08:00", activity: "Flight Departure", location: "Naha ➔ Taoyuan Int'l", note: "Relax and unwind during the short regional flight sector.", food: "In-flight meal service." },
                    { time: "10:00", activity: "Luggage Drop-off", location: "Hotel Relax III (Taipei Main)", note: "Brief pitstop. Luggage stays safely inside the private charter vehicle trunk to ensure rapid departure toward Yilan county.", food: "Taipei Main Station local snack stalls, pork pepper buns." },
                    { time: "11:30", activity: "Yilan Epicurean Lunch 🦆", location: "Silks Place Yilan", note: "Advanced reservation required. Legendary regional dining highlight.", food: "The famous multi-course Cherry Roasted Duck Feast (兰城晶英樱桃鸭)." },
                    { time: "13:30", activity: "Lanyang Museum", location: "Yilan Coast", note: "A striking piece of modern structural architecture. Fully interior AC with extensive elevator installations servicing every floor.", food: "Museum ground-level café, local iced fruit teas." },
                    { time: "15:00", activity: "Zhang Mei Ama’s Farm 🌾", location: "Yilan Farmstead", note: "Interactive animal experience feeding friendly Capybaras. Excellent opportunities for fun family photographs.", food: "Scallion pancakes made with fresh local Yilan Sanxing scallions." },
                    { time: "17:30", activity: "Ximending Walk & Nightlife", location: "Taipei District", note: "Stroll along the historic Red House plaza. Smooth walking paths.", food: "Ay-Chung Flour-Rice Noodles, Hot Star Large Fried Chicken, local braised pork rice." },
                    { time: "18:30", activity: "Carrefour Guilin Store", location: "Wanhua District", note: "One-stop destination for massive souvenir shopping hauls. Purchase goods and load them directly back into the charter vehicle.", food: "Carrefour internal bakery, Taiwanese fruit selections." }
                ]
            },
            "May 31": {
                title: "Day 5: Jiufen Old Town & Coastal Views",
                events: [
                    { time: "08:30", activity: "Authentic Taiwanese Breakfast", location: "Taipei Main Area", note: "Indulge in legendary morning comfort culinary items.", food: "Fuhang Soy Milk (famed savory soy milk & deep-fried dough sticks) or Zhen Fang savory egg crepes." },
                    { time: "10:15", activity: "Jiufen Old Street Historic Run", location: "Jiufen Hills", note: "CRITICAL DIRECTION: Instruct the charter driver to utilize the high-elevation drop-off point exclusively. This permits entering through a flat road and avoids the steep stairs.", food: "A-Gan-Yi Taro Balls, Lai Ah Po Taro Balls, traditional teahouses with sweeping mountain-to-sea vistas." },
                    { time: "14:30", activity: "Tiaoshi Coast Coffee Break ☕", location: "Jinshan Coastal Road", note: "Stunning sweeping oceanfront rest break. Relax and snap family shots near the iconic coastal bus stop view.", food: "Freshly brewed specialty siphon coffees, local waffle plates, refreshing iced fruit sodas." },
                    { time: "18:30", activity: "Raohe Street Night Market 🎪", location: "Songshan District", note: "CRITICAL ROUTING: Walk strictly in a single, continuous forward direction from end-to-end to prevent backtracking through crowds.", food: "Famed Michelin-recommended Black Pepper Pork Buns (Hujiao Bing), Herbal Pork Rib Soup." }
                ]
            },
            "June 1": {
                title: "Day 6: Old Taipei Charm & Farewell",
                events: [
                    { time: "09:15", activity: "Chengzhong Market Exploration", location: "Downtown Taipei", note: "Immerse in authentic old-school Taipei vibes. Safe, slower morning pace.", food: "Traditional hand-crafted bean curd jelly (Douhua), old-fashioned beef noodles, local scallion bread." },
                    { time: "11:45", activity: "Airport Charter Departure", location: "Hotel ➔ Taoyuan Airport", note: "Ensure prompt assembly. Tight schedule to meet the strict 12:30 PM airport arrival target.", food: "Quick station lunches or airport terminal dining options." },
                    { time: "12:30", activity: "Airport Check-In", location: "Taoyuan Terminal", note: "Relax at the departure gate for the 3:00 PM outbound international flight home.", food: "Airport duty-free area food options, Taiwanese milk tea final round." }
                ]
            }
        };

        // Simulated real-time updates for target parameters
        function updateLiveWeather() {
            // In production, fetch live APIs like OpenWeatherMap
            document.getElementById('oki-temp').innerText = (26 + Math.floor(Math.random() * 3)) + "°C";
            document.getElementById('tpe-temp').innerText = (24 + Math.floor(Math.random() * 3)) + "°C";
            const now = new Date();
            document.getElementById('weather-update-time').innerText = `Updated ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        let activeDay = "May 27";

        function renderTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = '';
            Object.keys(tripData).forEach(day => {
                const isActive = day === activeDay;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all duration-200 ${
                    isActive ? 'bg-teal-600 text-white shadow-sm scale-105' : 'bg-white text-slate-500 hover:bg-slate-100 border border-slate-200'
                }`;
                btn.innerText = day;
                btn.onclick = () => {
                    activeDay = day;
                    renderItinerary();
                    renderTabs();
                };
                container.appendChild(btn);
            });
            document.getElementById('current-date-badge').innerText = activeDay;
        }

        function renderItinerary() {
            const container = document.getElementById('itinerary-timeline');
            const data = tripData[activeDay];
            
            let html = `<div class="mb-2"><h2 class="text-base font-black text-slate-800">${data.title}</h2></div>`;
            
            data.events.forEach(item => {
                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-teal-500 to-cyan-500"></div>
                        
                        <div class="flex justify-between items-start pl-2">
                            <div>
                                <span class="inline-block bg-teal-50 text-teal-700 text-xs font-extrabold px-2 py-0.5 rounded-md mb-1 shadow-xs">${item.time}</span>
                                <h3 class="font-bold text-slate-800 text-base leading-tight">${item.activity}</h3>
                                <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                                    <i class="fa-solid fa-location-dot text-rose-500"></i> ${item.location}
                                </p>
                            </div>
                        </div>

                        ${item.shows ? `
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 flex items-start space-x-2 animate-pulse pl-3">
                            <i class="fa-solid fa-circle-exclamation text-amber-600 mt-0.5 text-sm"></i>
                            <div><strong class="font-bold">Live Show Alert:</strong> ${item.shows}</div>
                        </div>
                        ` : ''}

                        <div class="grid grid-cols-1 gap-2.5 pt-1 pl-2 text-xs">
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <span class="font-bold text-slate-500 block mb-0.5 uppercase tracking-wider text-[10px]">💡 Senior & Logistics Note</span>
                                <p class="text-slate-700 font-medium leading-relaxed">${item.note}</p>
                            </div>
                            <div class="bg-rose-50/50 p-2.5 rounded-xl border border-rose-100/70">
                                <span class="font-bold text-rose-600 block mb-0.5 uppercase tracking-wider text-[10px] flex items-center gap-1">
                                    <i class="fa-solid fa-utensils"></i> Food Suggestion
                                </span>
                                <p class="text-slate-700 font-medium leading-relaxed">${item.food}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // Initialize App Execution
        window.onload = () => {
            renderTabs();
            renderItinerary();
            updateLiveWeather();
            // Interval loop to refresh mock environmental parameter variables
            setInterval(updateLiveWeather, 30000);
        };
    </script>
</body>
</html>
