                        note: { en: "One-way continuous forward path walk to optimize energy levels.", zh: "开启单向不回头的顺畅观光动线。家乐福是全台特产最齐的一站式超市，买满后直接推上包车，无需手提受累。" }, 
                        food: { en: "Ay-Chung Flour-Rice Noodles / fresh local fruits like Mango and Wax Apples.", zh: "西门町招牌阿宗面线，家乐福内的台湾本地香甜大芒果、红肉火龙果、莲雾。" }

                        note: { en: "Direct front lobby drop off. Safe and comfortable.", zh: "战利品直接打包塞进尾箱，直接送达酒店门口，长辈安稳回房休息。" }, 
                        food: { en: "Pack your favorite local night treats back to the room.", zh: "打包带回酒店的香脆台湾盐酥鸡、招牌黑糖奶茶大夜宵。" }

            },
            "June 1": {
                title: { en: "June 1 (Mon) - Old Market Charm & Departure Home", zh: "6月1日 (周一) - 台北老城市场体验 + 顺利回马" },
                events: [
                    { 
                        time: "08:00", 
                        activity: { en: "Chengzhong Market Exploration", zh: "台北老城中传统市场体验" }, 
                        location: { en: "Old Taipei Market Quarter", zh: "台北市中心" }, 
                        note: { en: "Safe, slower morning walking pace to see authentic old town everyday life under shaded awnings.", zh: "【体验纯正台北慢生活】就在酒店隔壁，全是有遮阳蓬的平坦小巷。长辈最爱逛这种充满生活气息的地方，看看台湾本地人的水果蔬菜市集。" }, 
                        food: { en: "Handcrafted traditional soy curd jelly, noodles, or local breads.", zh: "纯手工古早味冰豆花、地道红烧牛肉面、老字号葱油饼。" }

                    {

        function updateLiveWeather() {
            document.getElementById('oki-temp').innerText = (26 + Math.floor(Math.random() * 3)) + "°C";
            document.getElementById('tpe-temp').innerText = (24 + Math.floor(Math.random() * 3)) + "°C";
            const now = new Date();
            const prefix = labelTranslations[currentLang].updated;
            document.getElementById('weather-update-time').innerText = `${prefix} ${now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
        }

        let activeDay = "May 27";

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            document.getElementById('lang-toggle').innerText = currentLang === 'en' ? '中文' : 'English';
            
            document.getElementById('app-title').innerText = labelTranslations[currentLang].title;
            document.getElementById('weather-title').innerHTML = `<i class="fa-solid fa-cloud-sun text-teal-600"></i> ${labelTranslations[currentLang].weather}`;
            
            document.querySelector('.id-okinawa').innerText = labelTranslations[currentLang].okinawa;
            document.querySelector('.id-taipei').innerText = labelTranslations[currentLang].taipei;

            updateLiveWeather();
            renderTabs();
            renderItinerary();
        }

        function renderTabs() {
            const container = document.getElementById('day-tabs');
            container.innerHTML = '';
            Object.keys(tripData).forEach(day => {
                const isActive = day === activeDay;
                const btn = document.createElement('button');
                btn.className = `px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all duration-200 ${
                    isActive ? 'bg-teal-600 text-white shadow-sm scale-105' : 'bg-white text-slate-500 hover:bg-slate-100 border border-slate-200'
                }`;
                btn.innerText = day;
                btn.onclick = () => {
                    activeDay = day;
                    renderItinerary();
                    renderTabs();
                };
                container.appendChild(btn);
            });
            document.getElementById('current-date-badge').innerText = activeDay;
        }

        function renderItinerary() {
            const container = document.getElementById('itinerary-timeline');
            const data = tripData[activeDay];
            
            let html = `<div class="mb-2"><h2 class="text-base font-black text-slate-800">${data.title[currentLang]}</h2></div>`;
            
            data.events.forEach(item => {
                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 space-y-3 relative overflow-hidden">
                        <div class="absolute left-0 top-0 bottom-0 w-1.5 bg-gradient-to-b from-teal-500 to-cyan-500"></div>
                        
                        <div class="flex justify-between items-start pl-2">
                            <div>
                                <span class="inline-block bg-teal-50 text-teal-700 text-xs font-extrabold px-2 py-0.5 rounded-md mb-1 shadow-xs">${item.time}</span>
                                <h3 class="font-bold text-slate-800 text-base leading-tight">${item.activity[currentLang]}</h3>
                                <p class="text-xs text-slate-400 mt-0.5 flex items-center gap-1">
                                    <i class="fa-solid fa-location-dot text-rose-500"></i> ${item.location[currentLang]}
                                </p>
                            </div>
                        </div>

                        ${item.shows ? `
                        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-900 flex items-start space-x-2 animate-pulse pl-3">
                            <i class="fa-solid fa-circle-exclamation text-amber-600 mt-0.5 text-sm"></i>
                            <div><strong class="font-bold">${labelTranslations[currentLang].alert}:</strong> ${item.shows[currentLang]}</div>
                        </div>
                        ` : ''}

                        <div class="grid grid-cols-1 gap-2.5 pt-1 pl-2 text-xs">
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <span class="font-bold text-slate-500 block mb-0.5 uppercase tracking-wider text-[10px]">💡 ${labelTranslations[currentLang].note}</span>
                                <p class="text-slate-700 font-medium leading-relaxed">${item.note[currentLang]}</p>
                            </div>
                            <div class="bg-rose-50/50 p-2.5 rounded-xl border border-rose-100/70">
                                <span class="font-bold text-rose-600 block mb-0.5 uppercase tracking-wider text-[10px] flex items-center gap-1">
                                    <i class="fa-solid fa-utensils"></i> ${labelTranslations[currentLang].food}
                                </span>
                                <p class="text-slate-700 font-medium leading-relaxed">${item.food[currentLang]}</p>
                            </div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        window.onload = () => {
            renderTabs();
            renderItinerary();
            updateLiveWeather();
            setInterval(updateLiveWeather, 30000);
        };
    </script>
</body>
</html>
